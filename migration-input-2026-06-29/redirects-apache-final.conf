# Final Apache redirect and gone rules for Pathfinder Pest Control
# Canonical decision: keep /new-articles/ as blog hub

<IfModule mod_rewrite.c>
RewriteEngine On

# Blog hub canonicalization
RewriteRule ^category/blog/?$ https://pathfinderpestcontrol.com/new-articles/ [R=301,L]

# Merge duplicates
RewriteRule ^bed-bug-inspection/?$ https://pathfinderpestcontrol.com/bed-bug-inspection-2/ [R=301,L]
RewriteRule ^what-is-ipm-integrated-pest-management-explained/?$ https://pathfinderpestcontrol.com/integrated-pest-management-benefits/ [R=301,L]
RewriteRule ^eco-friendly-pest-control-solutions/?$ https://pathfinderpestcontrol.com/integrated-pest-management-benefits/ [R=301,L]
RewriteRule ^pathfinder-pest-control-now-offers-gopher-removal-as-a-stand-alone-or-yard-pest-control-service-in-oklahoma/?$ https://pathfinderpestcontrol.com/gopher-removal/ [R=301,L]
RewriteRule ^mole-removal-mole-control-in-tulsa-broken-arrow-ok/?$ https://pathfinderpestcontrol.com/moles-voles-removal/ [R=301,L]

# Existing redirect to preserve
RewriteRule ^pest-control-in-owasso-ok-pathfinder-pest-control/?$ https://pathfinderpestcontrol.com/pest-control-owasso-ok/ [R=301,L]

# SAP merges
RewriteRule ^sap/jenks/?$ https://pathfinderpestcontrol.com/jenks-pest-control/ [R=301,L]
RewriteRule ^sap/broken-arrow/?$ https://pathfinderpestcontrol.com/broken-arrow-pest-control/ [R=301,L]
RewriteRule ^sap/glenpool/?$ https://pathfinderpestcontrol.com/glenpool-pest-control/ [R=301,L]
RewriteRule ^sap/catoosa/?$ https://pathfinderpestcontrol.com/catoosa-pest-control/ [R=301,L]
RewriteRule ^sap/coweta/?$ https://pathfinderpestcontrol.com/coweta-pest-control/ [R=301,L]
RewriteRule ^sap/bixby/?$ https://pathfinderpestcontrol.com/bixby-pest-control/ [R=301,L]

# Mark template/dev URLs as gone
RewriteRule ^template/ - [G,L]
RewriteRule ^template_tag/ - [G,L]

# Single off-topic URL gone
RewriteRule ^benefits-of-local-honey-natures-sweet-superfood/?$ - [G,L]

</IfModule>
